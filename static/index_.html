<!DOCTYPE html>
<html>

<head>
    <title>Sensor Data Live</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        h1 {
            color: #1a1a2e;
            margin-bottom: 20px;
        }

        /* Управление */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-connect {
            background: #28a745;
            color: white;
        }

        .btn-disconnect {
            background: #dc3545;
            color: white;
        }

        .btn-clear {
            background: #ffc107;
            color: #333;
        }

        #status {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        .connected {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .disconnected {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        /* ========== ПАНЕЛЬ 1: Текущие значения (карточки) ========== */
        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1a1a2e;
            border-left: 4px solid #667eea;
            padding-left: 12px;
        }

        .current-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .sensor-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 15px;
            color: white;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .sensor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .sensor-card.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5), 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .sensor-card.active::after {
            content: "📊";
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
        }

        .sensor-tag {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sensor-value {
            font-size: 32px;
            font-weight: bold;
        }

        .sensor-unit {
            font-size: 16px;
            margin-left: 5px;
        }

        .sensor-device {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 8px;
        }

        .sensor-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* Индикатор активного графика */
        .active-chart-info {
            background: #e8eaf6;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .active-tag {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .reset-chart-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .reset-chart-btn:hover {
            background: #5a67d8;
            transform: none;
        }

        /* ========== ПАНЕЛЬ 2: График ========== */
        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-height: 400px;
            width: 100%;
        }

        /* ========== ПАНЕЛЬ 3: Журнал ========== */
        .log-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .log-header {
            display: grid;
            grid-template-columns: 80px 180px 120px 1fr;
            gap: 10px;
            padding: 12px;
            background: #667eea;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .log-entry {
            display: grid;
            grid-template-columns: 80px 180px 120px 1fr;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            font-family: monospace;
        }

        .log-entry:hover {
            background: #f5f5f5;
        }

        .log-entry:nth-child(even) {
            background: #fafafa;
        }

        .log-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .tag-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .tag-temperature {
            background: #e74c3c;
            color: white;
        }

        .tag-humidity {
            background: #3498db;
            color: white;
        }

        .tag-pressure {
            background: #2ecc71;
            color: white;
        }

        .tag-default {
            background: #95a5a6;
            color: white;
        }

        .empty-log {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>

<body>
    <h1>📡 MQTT Sensor Data Dashboard</h1>

    <div class="controls">
        <button class="btn-connect" onclick="connectWebSocket()">🔌 Connect</button>
        <button class="btn-disconnect" onclick="disconnectWebSocket()">❌ Disconnect</button>
        <button class="btn-clear" onclick="clearAll()">🗑️ Clear All</button>
    </div>

    <div id="status" class="disconnected">⚫ Disconnected</div>

    <!-- ПАНЕЛЬ 1: Текущие значения по тегам -->
    <div class="panel">
        <div class="panel-title">📊 Текущие значения (по тегам) - кликните на карточку для отображения графика</div>
        <div class="current-grid" id="currentValuesGrid">
            <div style="color: #999; text-align: center; grid-column: 1/-1; padding: 20px;">
                Нет данных. Ожидание подключения...
            </div>
        </div>
    </div>

    <!-- ПАНЕЛЬ 2: График -->
    <div class="chart-container">
        <div class="panel-title">📈 График данных</div>
        <div class="active-chart-info" id="activeChartInfo">
            <span>📊 Текущий график: <span id="activeTag" class="active-tag">не выбран</span></span>
            <button class="reset-chart-btn" onclick="resetToTemperatureChart()">🔄 Показать температуру</button>
        </div>
        <canvas id="sensorChart"></canvas>
    </div>

    <!-- ПАНЕЛЬ 3: Журнал -->
    <div class="log-container">
        <div class="panel-title">📋 Журнал событий</div>
        <div class="log-header">
            <div>ID</div>
            <div>Дата/Время</div>
            <div>Тег</div>
            <div>Значение</div>
        </div>
        <div class="log-list" id="logList">
            <div class="empty-log">Нет записей в журнале</div>
        </div>
    </div>

    <script>
        let ws = null;
        let chart = null;

        // Хранилище текущих значений по тегам
        let currentValues = {};

        // Хранилище исторических данных для графиков
        let historicalData = {
            temperature: { labels: [], values: [] },
            humidity: { labels: [], values: [] },
            pressure: { labels: [], values: [] }
        };

        // Текущий активный тег для графика
        let activeTag = 'temperature';

        // Журнал записей (максимум 200)
        let logEntries = [];

        // Функция получения цвета для тега
        function getTagColor(tag) {
            const colors = {
                'temperature': 'tag-temperature',
                'temp': 'tag-temperature',
                'humidity': 'tag-humidity',
                'pressure': 'tag-pressure'
            };
            return colors[tag?.toLowerCase()] || 'tag-default';
        }

        // Функция получения единицы измерения
        function getUnit(tag) {
            const units = {
                'temperature': '°C',
                'temp': '°C',
                'humidity': '%',
                'pressure': 'hPa'
            };
            return units[tag?.toLowerCase()] || '';
        }

        // Функция получения названия для отображения
        function getDisplayName(tag) {
            const names = {
                'temperature': 'Температура',
                'temp': 'Температура',
                'humidity': 'Влажность',
                'pressure': 'Давление'
            };
            return names[tag?.toLowerCase()] || tag;
        }

        // Функция получения цвета линии для графика
        function getChartColor(tag) {
            const colors = {
                'temperature': '#e74c3c',
                'temp': '#e74c3c',
                'humidity': '#3498db',
                'pressure': '#2ecc71'
            };
            return colors[tag?.toLowerCase()] || '#95a5a6';
        }

        // Обновление графика на основе активного тега
        function updateChart() {
            if (!chart) return;

            const data = historicalData[activeTag] || { labels: [], values: [] };
            const unit = getUnit(activeTag);
            const color = getChartColor(activeTag);
            const displayName = getDisplayName(activeTag);

            chart.data.labels = data.labels;
            chart.data.datasets[0].label = `${displayName} (${unit})`;
            chart.data.datasets[0].data = data.values;
            chart.data.datasets[0].borderColor = color;
            chart.data.datasets[0].backgroundColor = `${color}1A`;
            chart.data.datasets[0].pointBackgroundColor = color;

            // Обновляем шкалу Y в зависимости от типа данных
            if (activeTag === 'temperature' || activeTag === 'temp') {
                chart.options.scales.y.title.text = `Температура (${unit})`;
                chart.options.scales.y.min = -10;
                chart.options.scales.y.max = 50;
            } else if (activeTag === 'humidity') {
                chart.options.scales.y.title.text = `Влажность (${unit})`;
                chart.options.scales.y.min = 0;
                chart.options.scales.y.max = 100;
            } else {
                chart.options.scales.y.title.text = `${displayName} (${unit})`;
                chart.options.scales.y.min = null;
                chart.options.scales.y.max = null;
            }

            chart.update();

            // Обновляем информацию об активном графике
            document.getElementById('activeTag').textContent = displayName;

            // Подсвечиваем активную карточку
            highlightActiveCard();
        }

        // Подсветка активной карточки
        function highlightActiveCard() {
            document.querySelectorAll('.sensor-card').forEach(card => {
                const cardTag = card.getAttribute('data-tag');
                if (cardTag === activeTag) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        // Добавление точки в исторические данные
        function addToHistory(tag, value, timestamp) {
            const time = new Date(timestamp).toLocaleTimeString();
            const normalizedTag = tag === 'temp' ? 'temperature' : tag.toLowerCase();

            if (!historicalData[normalizedTag]) {
                historicalData[normalizedTag] = { labels: [], values: [] };
            }

            historicalData[normalizedTag].labels.push(time);
            historicalData[normalizedTag].values.push(value);

            // Оставляем только последние 30 точек
            if (historicalData[normalizedTag].labels.length > 30) {
                historicalData[normalizedTag].labels.shift();
                historicalData[normalizedTag].values.shift();
            }

            // Если активный тег совпадает - обновляем график
            if (activeTag === normalizedTag) {
                updateChart();
            }
        }

        // Сброс графика на температуру
        function resetToTemperatureChart() {
            setActiveTag('temperature');
        }

        // Установка активного тега для графика
        function setActiveTag(tag) {
            const normalizedTag = tag === 'temp' ? 'temperature' : tag.toLowerCase();
            activeTag = normalizedTag;

            // Если для этого тега нет данных, создаем пустой массив
            if (!historicalData[activeTag]) {
                historicalData[activeTag] = { labels: [], values: [] };
            }

            updateChart();
        }

        // Обновление панели текущих значений
        function updateCurrentPanel() {
            const grid = document.getElementById('currentValuesGrid');

            if (Object.keys(currentValues).length === 0) {
                grid.innerHTML = '<div style="color: #999; text-align: center; grid-column: 1/-1; padding: 20px;">Нет данных. Ожидание подключения...</div>';
                return;
            }

            let html = '';
            for (const [tag, data] of Object.entries(currentValues)) {
                const tagClass = getTagColor(tag);
                const unit = getUnit(tag);
                const displayName = getDisplayName(tag);

                html += `
                    <div class="sensor-card" data-tag="${tag}" onclick="setActiveTag('${tag}')">
                        <div class="sensor-tag">🏷️ ${displayName}</div>
                        <div class="sensor-value">
                            ${data.value}
                            <span class="sensor-unit">${unit}</span>
                        </div>
                        <div class="sensor-device">📱 Device: ${data.device}</div>
                        <div class="sensor-time">🕐 ${data.time}</div>
                    </div>
                `;
            }
            grid.innerHTML = html;
            highlightActiveCard();
        }

        // Очистка исторических данных
        function clearHistory() {
            historicalData = {
                temperature: { labels: [], values: [] },
                humidity: { labels: [], values: [] },
                pressure: { labels: [], values: [] }
            };
            activeTag = 'temperature';
            if (chart) {
                updateChart();
            }
        }

        // Добавление записи в журнал
        function addToLog(id, datetime, tag, value) {
            const tagClass = getTagColor(tag);
            const unit = getUnit(tag);
            const displayValue = `${value}${unit}`;
            const displayName = getDisplayName(tag);

            logEntries.unshift({
                id,
                datetime,
                tag: displayName,
                value: displayValue,
                tagClass
            });

            if (logEntries.length > 200) {
                logEntries.pop();
            }

            renderLog();
        }

        // Отрисовка журнала
        function renderLog() {
            const logList = document.getElementById('logList');

            if (logEntries.length === 0) {
                logList.innerHTML = '<div class="empty-log">Нет записей в журнале</div>';
                return;
            }

            let html = '';
            for (const entry of logEntries) {
                html += `
                    <div class="log-entry">
                        <div>#${entry.id}</div>
                        <div>${entry.datetime}</div>
                        <div>
                            <span class="tag-badge ${entry.tagClass}">${entry.tag}</span>
                        </div>
                        <div>${entry.value}</div>
                    </div>
                `;
            }
            logList.innerHTML = html;
        }

        // Очистка всех данных
        function clearAllData() {
            currentValues = {};
            logEntries = [];
            clearHistory();

            updateCurrentPanel();
            renderLog();
        }

        // Обработка новых данных сенсора
        function handleSensorData(data) {
            const { id, device, tag, value } = data;
            const now = new Date();
            const datetime = now.toLocaleString('ru-RU');
            const time = now.toLocaleTimeString('ru-RU');
            const normalizedTag = tag === 'temp' ? 'temperature' : tag.toLowerCase();

            // Обновляем текущие значения
            currentValues[normalizedTag] = {
                device: device,
                value: value,
                time: time,
                timestamp: now.getTime()
            };
            updateCurrentPanel();

            // Добавляем в историю для графика
            addToHistory(normalizedTag, value, now);

            // Добавляем в журнал
            addToLog(id, datetime, normalizedTag, value);
        }

        // Инициализация графика
        function initChart() {
            const ctx = document.getElementById('sensorChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Температура (°C)',
                        data: [],
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 7,
                        pointBackgroundColor: '#e74c3c',
                        pointBorderColor: 'white',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Температура (°C)',
                                color: '#e74c3c'
                            },
                            min: -10,
                            max: 50,
                            grid: {
                                color: 'rgba(231, 76, 60, 0.1)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Время'
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 10
                            }
                        }
                    }
                }
            });
        }

        // WebSocket подключение
        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log('WebSocket already connected');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/sensors/live`;

            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = '✅ Connected - Receiving sensor data';
                statusDiv.className = 'connected';
                console.log('WebSocket connected');

                logEntries.unshift({
                    id: 'sys',
                    datetime: new Date().toLocaleString('ru-RU'),
                    tag: 'system',
                    value: 'WebSocket connected',
                    tagClass: 'tag-default'
                });
                renderLog();
            };

            ws.onmessage = function (event) {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received:', message);

                    if (message.type === 'connected') {
                        const statusDiv = document.getElementById('status');
                        statusDiv.innerHTML = `✅ Connected - ${message.message} (${message.clients_connected} clients)`;

                    } else if (message.type === 'new_sensor_data') {
                        handleSensorData(message.data);

                    } else if (message.type === 'pong') {
                        console.log('Heartbeat received');
                    }
                } catch (e) {
                    console.error('Error parsing message:', e, event.data);
                }
            };

            ws.onerror = function (error) {
                console.error('WebSocket error:', error);
                document.getElementById('status').innerHTML = '⚠️ WebSocket Error';
                document.getElementById('status').className = 'disconnected';
            };

            ws.onclose = function () {
                document.getElementById('status').innerHTML = '❌ Disconnected';
                document.getElementById('status').className = 'disconnected';
                console.log('WebSocket disconnected');

                setTimeout(() => {
                    if (!ws || ws.readyState === WebSocket.CLOSED) {
                        console.log('Attempting to reconnect...');
                        connectWebSocket();
                    }
                }, 3000);
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function clearAll() {
            clearAllData();

            logEntries.unshift({
                id: 'sys',
                datetime: new Date().toLocaleString('ru-RU'),
                tag: 'system',
                value: 'All data cleared',
                tagClass: 'tag-default'
            });
            renderLog();
        }

        // Инициализация при загрузке
        initChart();
        connectWebSocket();
    </script>
</body>

</html>
